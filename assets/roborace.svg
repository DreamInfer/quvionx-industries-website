<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="t d">
<title id="t">RoboRace competition robot visualization</title><desc id="d">Illustrative low profile four-wheel race robot with black and gold body and engineered chassis.</desc>
<defs>
