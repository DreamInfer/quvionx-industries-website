<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<pattern id="g" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" stroke="#a89669" opacity=".06" fill="none"/></pattern>
</defs>
