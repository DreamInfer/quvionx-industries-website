<path d="M174 360L558 248L764 313L389 447Z" fill="#121516" stroke="#3a3d3e" stroke-width="3"/>
<path d="M188 366L555 262L737 318L385 433Z" fill="#25292b" stroke="#b68e49" stroke-width="3"/>
<path d="M157 369L389 462L389 510L154 406Z" fill="#35383a" stroke="#8d9294" stroke-width="3"/>
<path d="M389 462L790 309L790 351L389 510Z" fill="#181a1b" stroke="#b88e45" stroke-width="4"/>
<path d="M156 403L388 503L388 513L147 414Z" fill="url(#gold)" opacity=".85"/>
