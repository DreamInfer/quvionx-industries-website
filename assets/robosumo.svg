<g transform="translate(482 341) rotate(-17)"><text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing="3" fill="url(#gold)">QXI</text><text x="0" y="26" text-anchor="middle" font-family="Arial" font-size="11" letter-spacing="5" fill="#d4d1c6">ROBOSUMO</text></g>
<text x="58" y="68" font-family="Arial" font-size="13" letter-spacing="5" fill="#dfbe7f">ENGINEERED FOR THE ARENA</text>
