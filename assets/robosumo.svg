<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="t d">
<title id="t">RoboSumo 4WD wedge robot visualization</title><desc id="d">Illustrative black and gold wedge competition robot with four wheels and an angular metal chassis.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#313027"/><stop offset=".6" stop-color="#191a1b"/><stop offset="1" stop-color="#101113"/></radialGradient>
<linearGradient id="body" x1=".1" y1="0" x2="1" y2="1"><stop stop-color="#53575a"/><stop offset=".3" stop-color="#222528"/><stop offset=".75" stop-color="#101214"/><stop offset="1" stop-color="#555759"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4c1"/><stop offset=".3" stop-color="#d7a852"/><stop offset=".65" stop-color="#91612b"/><stop offset="1" stop-color="#ffe39b"/></linearGradient>
<linearGradient id="wheel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343638"/><stop offset=".48" stop-color="#070809"/><stop offset="1" stop-color="#3d4043"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
<pattern id="grid" width="65" height="65" patternUnits="userSpaceOnUse"><path d="M65 0H0V65" stroke="#c9aa70" opacity=".07" fill="none"/></pattern>
</defs>
<rect width="920" height="680" rx="26" fill="url(#bg)"/>
<rect width="920" height="680" rx="26" fill="url(#grid)"/>
<circle cx="695" cy="145" r="190" fill="#ffbd57" opacity=".055"/>
<ellipse cx="445" cy="528" rx="365" ry="67" fill="#000" opacity=".75" filter="url(#shadow)"/>
<path d="M78 510L818 510" stroke="#b4935b" opacity=".2"/>
<path d="M115 555L800 555" stroke="#b4935b" opacity=".1"/>
<!-- rear left, rear right wheels -->
<g transform="translate(646 359)"><ellipse cx="0" cy="75" rx="70" ry="87" fill="url(#wheel)" stroke="#575a5c" stroke-width="9"/><ellipse cx="-7" cy="76" rx="35" ry="52" fill="#0d0f10" stroke="#c99b50" stroke-width="5"/><ellipse cx="-7" cy="76" rx="13" ry="20" fill="url(#gold)"/><g stroke="#686969" stroke-width="7"><path d="M-62 47l15 10M-62 92l16 3M37 24l-12 17M41 122l-17-10"/></g></g>
<g transform="translate(333 447)"><ellipse cx="0" cy="32" rx="73" ry="78" fill="url(#wheel)" stroke="#65686a" stroke-width="9"/><ellipse cx="-8" cy="34" rx="37" ry="48" fill="#121416" stroke="#c8a25d" stroke-width="5"/><ellipse cx="-8" cy="34" rx="14" ry="18" fill="url(#gold)"/></g>
<!-- top enclosure -->
